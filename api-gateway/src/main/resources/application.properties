spring.application.name=api-gateway

# API property configs:
spring.cloud.gateway.server.webflux.routes[0].id=healthprovider-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://HEALTHPROVIDER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/api/v1/healthproviders/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=JwtFilter

spring.cloud.gateway.server.webflux.routes[1].id=appointment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/appointments/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtFilter

spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/users/**

# Eureka config:
eureka.client.service-url.defaultZone=http://localhost:9092/eureka/