spring.application.name=appointment-service

spring.datasource.url=jdbc:mysql://localhost:3307/appointment_service
spring.datasource.username=username
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### Spring-JPA configurations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

### Eureka Config
#Turn off Client if not run already
#eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:9092/eureka/
eureka.instance.prefer-ip-address=true
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true

### Resilience4j properties:
# Circuit breaker name is "healthProvider" for healthProvider service
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.healthProvider.register-health-indicator=true
resilience4j.circuitbreaker.instances.healthProvider.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.healthProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.healthProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.healthProvider.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.healthProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.healthProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.healthProvider.automatic-transition-from-open-to-half-open-enabled=true
## Retry mechanism for circuite breaker:
# "healthprovider": the retry module name for 'healthProvider'
resilience4j.retry.instances.healthprovider.max-attempts=3
resilience4j.retry.instances.healthprovider.wait-duration=10s

### 07-circuit-breaker: Actuator properties
management.health.circuitbreakers.enabled=true
#management.endpoints.web.exposure.include=health
#management.endpoint.health.show-details=always

### 08-observability: Actuator properties
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0

